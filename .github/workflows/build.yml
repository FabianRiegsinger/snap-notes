name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bin: snap-notes.exe
          - name: macos-arm64
            os: macos-latest
            bin: snap-notes
          - name: linux-x64
            os: ubuntu-24.04
            bin: snap-notes
          - name: linux-arm64
            os: ubuntu-24.04-arm
            bin: snap-notes

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --bin snap-notes

      - name: Build release
        run: cargo build --release

      - uses: actions/upload-artifact@v7
        with:
          name: snap-notes-${{ matrix.name }}
          path: target/release/${{ matrix.bin }}
          if-no-files-found: error

      # Installers: a drag-to-Applications .dmg, a .deb with a menu entry,
      # and a per-user Windows setup.exe.
      - name: Import Developer ID certificate (macOS)
        # Skipped without the secrets; the .dmg is then ad-hoc signed.
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$MACOS_CERTIFICATE" ] || exit 0
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          # Notarizing takes minutes, so only tagged releases do it.
          APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: packaging/macos/bundle.sh "package/snap-notes-${{ matrix.name }}.dmg"

      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-deb

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: mkdir -p package && cargo deb --no-build --output "package/snap-notes-${{ matrix.name }}.deb"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          iscc "/DVersion=$version" "/O$PWD\package" "/Fsnap-notes-${{ matrix.name }}-setup" packaging\windows\snap-notes.iss

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.name }}
          path: package/*
          if-no-files-found: error

  release:
    name: Release
    # A pushed tag like v1.2.0 publishes a GitHub Release with every build.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Name each binary after its platform
        # Each artifact downloads into a folder named after it, so the
        # renamed binaries go to their own folder.
        run: |
          mkdir release
          # Installers already carry their final names.
          mv dist/package-*/* release/
          for d in dist/snap-notes-*/; do
            name=$(basename "$d")
            for f in "$d"*; do
              ext=""
              case "$f" in *.exe) ext=".exe" ;; esac
              mv "$f" "release/$name$ext"
            done
          done
          ls -l release

      - name: Publish release
        # Releases are immutable once published, so the workflow must create
        # the release itself: gh uploads to a draft, then publishes it.
        # Push only the tag; do not create the release by hand first.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --generate-notes
