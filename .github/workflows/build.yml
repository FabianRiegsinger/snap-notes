name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bin: work-notes.exe
          - name: macos-arm64
            os: macos-latest
            bin: work-notes
          - name: linux-x64
            os: ubuntu-24.04
            bin: work-notes
          - name: linux-arm64
            os: ubuntu-24.04-arm
            bin: work-notes

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Test
        run: cargo test --bin work-notes

      - name: Build release
        run: cargo build --release

      - uses: actions/upload-artifact@v7
        with:
          name: work-notes-${{ matrix.name }}
          path: target/release/${{ matrix.bin }}
          if-no-files-found: error
