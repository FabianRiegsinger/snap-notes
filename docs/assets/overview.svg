<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Snap Notes: the bar strip, a hover peek and an open note</title>
  <!-- Desktop -->
  <rect width="760" height="420" rx="14" fill="#1f2430"/>
  <rect x="0" y="0" width="760" height="26" rx="14" fill="#2a303d"/>
  <rect x="0" y="14" width="760" height="12" fill="#2a303d"/>
  <circle cx="20" cy="13" r="5" fill="#ff5f57"/>
  <circle cx="38" cy="13" r="5" fill="#febc2e"/>
  <circle cx="56" cy="13" r="5" fill="#28c840"/>
  <!-- Menu bar icon -->
  <rect x="700" y="6" width="12" height="15" rx="2" fill="none" stroke="#e8ebf2" stroke-width="1.5"/>
  <line x1="703" y1="11" x2="709" y2="11" stroke="#e8ebf2" stroke-width="1.2"/>
  <line x1="703" y1="14" x2="709" y2="14" stroke="#e8ebf2" stroke-width="1.2"/>
  <line x1="703" y1="17" x2="709" y2="17" stroke="#e8ebf2" stroke-width="1.2"/>

  <!-- Open note -->
  <g>
    <rect x="70" y="70" width="300" height="290" rx="8" fill="#000" opacity="0.25" transform="translate(4 10)"/>
    <rect x="70" y="70" width="300" height="290" rx="8" fill="#ffe57a"/>
    <rect x="200" y="78" width="40" height="4" rx="2" fill="#000" opacity="0.18"/>
    <text x="88" y="110" font-size="17" font-weight="700" fill="#211f1a">Sprint review</text>
    <circle cx="300" cy="105" r="7" fill="#ffd93d" stroke="#211f1a" stroke-opacity="0.35"/>
    <text x="318" y="110" font-size="13" fill="#211f1a" opacity="0.5">🗑  ✕</text>
    <line x1="84" y1="124" x2="356" y2="124" stroke="#211f1a" stroke-opacity="0.15"/>
    <text font-size="14" fill="#211f1a" opacity="0.88">
      <tspan x="88" y="150">Demo the new settings panel</tspan>
      <tspan x="88" y="172">Ship the menu bar icon</tspan>
      <tspan x="88" y="194">Ask design about the peek</tspan>
      <tspan x="88" y="216">Book room for Friday</tspan>
    </text>
    <!-- Resize handle hint -->
    <path d="M352 346 L362 336 M356 352 L364 344" stroke="#211f1a" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>
  <text x="70" y="390" font-size="13" fill="#9aa3b5">Open note: drag it anywhere, resize from any edge</text>

  <!-- Peek -->
  <g>
    <rect x="452" y="150" width="260" height="128" rx="8" fill="#000" opacity="0.25" transform="translate(-2 4)"/>
    <rect x="452" y="150" width="260" height="128" rx="8" fill="#9fc1fa"/>
    <text x="470" y="180" font-size="16" font-weight="700" fill="#211f1a">Groceries</text>
    <line x1="466" y1="192" x2="698" y2="192" stroke="#211f1a" stroke-opacity="0.15"/>
    <text font-size="14" fill="#211f1a" opacity="0.8">
      <tspan x="470" y="216">Oat milk</tspan>
      <tspan x="470" y="236">Coffee beans</tspan>
      <tspan x="470" y="256">Basil</tspan>
    </text>
  </g>
  <text x="452" y="300" font-size="13" fill="#9aa3b5">Hover peek: rest on a bar</text>

  <!-- Bar strip (right edge) -->
  <g>
    <rect x="740" y="96" width="6" height="30" rx="3" fill="#ff6b6b"/>
    <rect x="734" y="134" width="12" height="44" rx="3" fill="#ffd93d"/>
    <rect x="712" y="186" width="34" height="62" rx="3" fill="#6a9cf7"/>
    <rect x="734" y="256" width="12" height="44" rx="3" fill="#6bcb77"/>
    <rect x="740" y="308" width="6" height="30" rx="3" fill="#b983ff"/>
    <rect x="740" y="358" width="6" height="30" rx="3" fill="none" stroke="#727682" stroke-width="1.5"/>
  </g>
  <text x="600" y="80" font-size="13" fill="#9aa3b5" text-anchor="end">Bars magnify like the Dock</text>
  <path d="M606 76 Q680 76 730 110" fill="none" stroke="#9aa3b5" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="726" y="410" font-size="12" fill="#9aa3b5" text-anchor="end">+ adds a note</text>
</svg>
