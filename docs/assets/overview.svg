<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Snap Notes: the bar strip on the right edge, a hover peek and an open note</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3350"/>
      <stop offset="0.55" stop-color="#1c2236"/>
      <stop offset="1" stop-color="#151a29"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.22" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#7a5cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7a5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#1fb5a8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1fb5a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paperY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeb8f"/>
      <stop offset="1" stop-color="#ffe06a"/>
    </linearGradient>
    <linearGradient id="paperB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3cffc"/>
      <stop offset="1" stop-color="#9cbff8"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="screen"><rect width="880" height="480" rx="16"/></clipPath>
  </defs>

  <!-- Desktop -->
  <g clip-path="url(#screen)">
    <rect width="880" height="480" fill="url(#wall)"/>
    <rect width="880" height="480" fill="url(#glowA)"/>
    <rect width="880" height="480" fill="url(#glowB)"/>
    <!-- Menu bar -->
    <rect width="880" height="28" fill="#0d1120" fill-opacity="0.55"/>
    <text x="22" y="19" font-size="12.5" font-weight="600" fill="#e8ebf2">Snap Notes</text>
    <!-- Menu bar icon -->
    <g transform="translate(800 7)" fill="none" stroke="#e8ebf2" stroke-width="1.4" stroke-linecap="round">
      <rect x="0.7" y="0.7" width="11" height="13" rx="2.5"/>
      <line x1="3.5" y1="5" x2="9" y2="5"/>
      <line x1="3.5" y1="8" x2="9" y2="8"/>
      <line x1="3.5" y1="11" x2="7" y2="11"/>
    </g>
    <text x="858" y="19" font-size="12" fill="#e8ebf2" fill-opacity="0.8" text-anchor="end">9:41</text>
  </g>

  <!-- Open note -->
  <g filter="url(#lift)">
    <rect x="80" y="76" width="360" height="290" rx="12" fill="url(#paperY)"/>
  </g>
  <g fill="#211f1a">
    <rect x="240" y="84" width="40" height="4" rx="2" fill-opacity="0.16"/>
    <text x="100" y="122" font-size="18" font-weight="700">Sprint review</text>
    <!-- Reminder label -->
    <g transform="translate(232 109)" fill="none" stroke="#211f1a" stroke-opacity="0.6" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M2 10 h10 l-1.4-2 v-3.2 a3.6 3.6 0 0 0 -7.2 0 v3.2 z"/>
      <path d="M5.6 12 a1.4 1.4 0 0 0 2.8 0"/>
    </g>
    <text x="250" y="121" font-size="12.5" fill-opacity="0.6">Fri 15:00</text>
    <!-- Header icons: pin, copy, trash, close -->
    <g fill="none" stroke="#211f1a" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(330 108)"><path d="M5 1 h6 M6 1 v5 l-3 3 h10 l-3 -3 v-5 M8 9 v6"/></g>
      <g transform="translate(356 108)"><rect x="4" y="4" width="10" height="10" rx="2"/><path d="M2 11 v-8 a1 1 0 0 1 1 -1 h8"/></g>
      <g transform="translate(382 108)"><path d="M2 4 h12 M6 4 v-2 h4 v2 M3.5 4 l1 10 h7 l1 -10"/></g>
      <g transform="translate(408 108)"><path d="M3 3 l10 10 M13 3 l-10 10"/></g>
    </g>
    <line x1="96" y1="138" x2="424" y2="138" stroke="#211f1a" stroke-opacity="0.14"/>

    <!-- Checklist -->
    <g font-size="14.5">
      <g fill="none" stroke="#211f1a" stroke-width="1.4">
        <rect x="101" y="157" width="13" height="13" rx="3" fill="#211f1a" fill-opacity="0.75" stroke="none"/>
        <path d="M104 163.5 l2.6 2.6 l4.6 -5" stroke="#ffe57a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="101" y="183" width="13" height="13" rx="3" fill="#211f1a" fill-opacity="0.75" stroke="none"/>
        <path d="M104 189.5 l2.6 2.6 l4.6 -5" stroke="#ffe57a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="101.7" y="209.7" width="11.6" height="11.6" rx="3" stroke-opacity="0.55"/>
        <rect x="101.7" y="235.7" width="11.6" height="11.6" rx="3" stroke-opacity="0.55"/>
      </g>
      <text x="124" y="169" fill-opacity="0.45" text-decoration="line-through">Demo the settings panel</text>
      <text x="124" y="195" fill-opacity="0.45" text-decoration="line-through">Ship the menu bar icon</text>
      <text x="124" y="221" fill-opacity="0.88">Ask design about the peek</text>
      <text x="124" y="247" fill-opacity="0.88">Book a room for Friday</text>
    </g>

    <!-- Rich text -->
    <text font-size="14.5" fill-opacity="0.88">
      <tspan x="100" y="294">Keep it </tspan><tspan font-weight="700">short</tspan><tspan>, </tspan><tspan fill="#c2410c" font-weight="600">color</tspan><tspan> what </tspan><tspan font-style="italic">matters</tspan><tspan>.</tspan>
    </text>
    <text x="100" y="322" font-size="14.5" fill-opacity="0.88">Paste images, add <tspan fill="#2d5bd0" text-decoration="underline">links</tspan> and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5">code</tspan>.</text>

    <!-- Resize grip -->
    <path d="M422 354 L430 346 M426 358 L432 352" stroke="#211f1a" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Hover peek, attached to the magnified bar -->
  <g filter="url(#lift)">
    <rect x="574" y="214" width="236" height="136" rx="12" fill="url(#paperB)"/>
  </g>
  <g fill="#211f1a">
    <text x="592" y="244" font-size="16" font-weight="700">Groceries</text>
    <text x="792" y="244" font-size="12.5" fill-opacity="0.55" text-anchor="end">2/5</text>
    <line x1="588" y1="256" x2="796" y2="256" stroke="#211f1a" stroke-opacity="0.14"/>
    <text font-size="14" fill-opacity="0.8">
      <tspan x="592" y="280">Oat milk</tspan>
      <tspan x="592" y="302">Coffee beans</tspan>
      <tspan x="592" y="324">Basil, lemons</tspan>
    </text>
  </g>

  <!-- Bar strip on the right edge -->
  <g filter="url(#soft)">
    <!-- Pinned: darker notch on top -->
    <rect x="856" y="96" width="8" height="32" rx="3" fill="#ff6b6b"/>
    <rect x="856" y="96" width="8" height="4" rx="2" fill="#a83a3a"/>
    <!-- Stack: card edges to the left -->
    <rect x="846" y="194" width="1.5" height="22" rx="0.75" fill="#b983ff" fill-opacity="0.45"/>
    <rect x="850" y="192" width="1.5" height="26" rx="0.75" fill="#b983ff" fill-opacity="0.7"/>
    <rect x="854" y="190" width="10" height="30" rx="3" fill="#b983ff"/>
    <!-- Hovered and magnified -->
    <rect x="822" y="228" width="42" height="96" rx="4" fill="#6a9cf7"/>
    <rect x="850" y="334" width="14" height="44" rx="3" fill="#6bcb77"/>
    <rect x="856" y="388" width="8" height="28" rx="3" fill="#ffa94d"/>
  </g>
  <!-- Checklist progress: done share filled from the bottom over a faint bar -->
  <rect x="850" y="138" width="14" height="44" rx="3" fill="#fff0a8" fill-opacity="0.35"/>
  <path d="M850 160 h14 v19 a3 3 0 0 1 -3 3 h-8 a3 3 0 0 1 -3 -3 z" fill="#ffd93d" filter="url(#soft)"/>
  <!-- Slots: new note and search -->
  <g fill="none" stroke="#c6ccda" stroke-width="1.5" stroke-linecap="round">
    <rect x="850.75" y="426.75" width="12.5" height="12.5" rx="3" stroke-opacity="0.6"/>
    <path d="M857 429.5 v7 M853.5 433 h7"/>
    <circle cx="856" cy="453.5" r="3.6"/>
    <path d="M858.7 456.2 l2.6 2.6"/>
  </g>

  <!-- Callouts -->
  <g font-size="12.5" fill="#c9d1e3">
    <g stroke="#c9d1e3" stroke-opacity="0.45" fill="none">
      <path d="M800 112 H846"/>
      <path d="M800 160 H842"/>
      <path d="M800 205 H838"/>
      <path d="M800 446 H844"/>
    </g>
    <g fill="#c9d1e3">
      <circle cx="800" cy="112" r="2"/>
      <circle cx="800" cy="160" r="2"/>
      <circle cx="800" cy="205" r="2"/>
      <circle cx="800" cy="446" r="2"/>
    </g>
    <text x="792" y="116" text-anchor="end">Pinned</text>
    <text x="792" y="164" text-anchor="end">Checklist progress</text>
    <text x="792" y="209" text-anchor="end">Stacked notes</text>
    <text x="792" y="450" text-anchor="end">New note · search</text>
    <text x="574" y="372">Hover peek · bars magnify like the Dock</text>
    <text x="80" y="394">Open note · drag anywhere, resize, rich text, reminders</text>
  </g>
</svg>
